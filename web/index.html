<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#110c1c">
<meta name="color-scheme" content="dark">
<title>OpLarik</title>
<link rel="icon" type="image/png" sizes="64x64" href="img/icon-64.png">
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme-boot.js"></script>
</head>
<body>
<div id="app" class="app booting">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <div class="shell">
    <header class="topbar" id="topbar"></header>
    <div class="banners" id="banners"></div>
    <main class="main" id="main"><div class="page" id="page"></div></main>
  </div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="modal-layer" id="modal"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>
<div class="splash" id="splash">
  <img src="img/logo.svg" alt="" width="72" height="72">
  <div class="splash-name">OpLarik</div>
  <div class="splash-bar"><i></i></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
